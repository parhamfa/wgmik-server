services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/wgmik.db}
      # Empty -> auto-generated and persisted to /data/secret_key on first run.
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: "true"
      VITE_PROXY_TARGET: http://127.0.0.1:8000
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/data
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\" && node -e \"require('http').get('http://127.0.0.1:5173', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1));\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  frontend_node_modules:
