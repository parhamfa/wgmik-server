services:
  api:
    # Prebuilt image from GHCR. `docker compose pull` fetches it; running
    # `docker compose up --build` instead builds locally and tags it the same.
    image: ghcr.io/parhamfa/wgmik-server-api:${WGMIK_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Persist DB in the bind-mounted ./data dir.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/wgmik.db}
      # Encrypts RouterOS passwords / WG keys / Telegram token and signs JWTs.
      # Leave empty: the backend auto-generates one on first run and persists it
      # to /data/secret_key. Only set this to pin a key (e.g. multi-instance).
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/parhamfa/wgmik-server-web:${WGMIK_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Web UI (nginx serves built frontend, proxies /api to backend)
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

